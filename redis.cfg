# Upstash Redis on/off switch for the optional analysis cache, read at startup
# (services/cache.js). Nothing depends on Redis for correctness: sessions,
# jobs and stats live elsewhere, and the AI quota / cost-bearing rate limits
# use their own database (server/sharedCounters.js, QUOTA_REDIS_REST_*),
# which this switch does not control.
#   enabled  - analysis:* results are cached in Upstash (fails open; a breaker
#              turns it off on quota/auth errors and re-probes later)
#   disabled - no analysis cache; Upstash is never contacted
# Change it and push to main to redeploy. For an instant flip without a build:
#   gcloud run services update bsod-analyzer --region=us-east1 --update-env-vars REDIS_ENABLED=true
# (REDIS_ENABLED overrides this file; remove it with --remove-env-vars REDIS_ENABLED.)
disabled
