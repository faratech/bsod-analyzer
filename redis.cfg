# Upstash Redis on/off switch, read once at startup (services/cache.js).
#   enabled  - sessions, jobs, quotas, rate limits and the analysis cache live in Upstash
#   disabled - each instance keeps that state in memory; Upstash is never contacted
# Change it and push to main to redeploy. For an instant flip without a build:
#   gcloud run services update bsod-analyzer --region=us-east1 --update-env-vars REDIS_ENABLED=true
# (REDIS_ENABLED overrides this file; remove it with --remove-env-vars REDIS_ENABLED.)
disabled
