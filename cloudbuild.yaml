steps:
  # Reject mutable dictionary aliases and invalid staged-write values before
  # spending time on the image build.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-ceu'
      - |
        if [[ ! "${_CACHE_ZSTD_DICTIONARY_VERSION}" =~ ^[1-9][0-9]*$ ]]; then
          echo "_CACHE_ZSTD_DICTIONARY_VERSION must be a pinned numeric Secret Manager version."
          exit 1
        fi
        if [[ "${_CACHE_ZSTD_WRITES_ENABLED}" != "true" && "${_CACHE_ZSTD_WRITES_ENABLED}" != "false" ]]; then
          echo "_CACHE_ZSTD_WRITES_ENABLED must be exactly 'true' or 'false'."
          exit 1
        fi
        if [[ "${_CSP_MODE}" != "report-only" && "${_CSP_MODE}" != "enforce" ]]; then
          echo "_CSP_MODE must be exactly 'report-only' or 'enforce'."
          exit 1
        fi

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--pull', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/bsod-analyzer:latest', '.']
  
  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/bsod-analyzer:latest']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-ceu'
      - |
        AI_SECRET_BINDING='${_AI_SECRET_BINDING}'
        if gcloud secrets versions list experiential-labs-api-key \
          --project="$PROJECT_ID" \
          --filter='state=ENABLED' \
          --limit=1 \
          --format='value(name)' | grep -q .; then
          case ",$${AI_SECRET_BINDING}," in
            *,EXPLABS_API_KEY=experiential-labs-api-key:latest,*) ;;
            *) AI_SECRET_BINDING="$${AI_SECRET_BINDING},EXPLABS_API_KEY=experiential-labs-api-key:latest" ;;
          esac
        fi
        # WindowsForum crash-signal ingest key (server/crashSignal.js); recording
        # stays off unless both it and WF_CRASH_SIGNAL_URL are bound.
        CRASH_SIGNAL_BINDING=''
        if gcloud secrets versions list wf-crash-signal-key \
          --project="$PROJECT_ID" \
          --filter='state=ENABLED' \
          --limit=1 \
          --format='value(name)' | grep -q .; then
          CRASH_SIGNAL_BINDING=',WF_CRASH_SIGNAL_KEY=wf-crash-signal-key:latest'
        fi
        # Dedicated Upstash database for the cross-instance AI quota and
        # cost-bearing rate limits (server/sharedCounters.js); those counters
        # stay per instance until both secrets have an enabled version.
        QUOTA_STORE_BINDING=''
        if gcloud secrets versions list quota-redis-rest-url \
          --project="$PROJECT_ID" \
          --filter='state=ENABLED' \
          --limit=1 \
          --format='value(name)' | grep -q . \
          && gcloud secrets versions list quota-redis-rest-token \
          --project="$PROJECT_ID" \
          --filter='state=ENABLED' \
          --limit=1 \
          --format='value(name)' | grep -q .; then
          QUOTA_STORE_BINDING=',QUOTA_REDIS_REST_URL=quota-redis-rest-url:latest,QUOTA_REDIS_REST_TOKEN=quota-redis-rest-token:latest'
        fi
        gcloud run deploy bsod-analyzer \
          --image "${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/bsod-analyzer:latest" \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated \
          --no-default-url \
          --service-account "bsod-analyzer-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
          --port 8080 \
          --use-http2 \
          --max-instances "${_MAX_INSTANCES}" \
          --session-affinity \
          --concurrency 2 \
          --min-instances 1 \
          --memory 1Gi \
          --no-cpu-throttling \
          --cpu-boost \
          --update-env-vars "NODE_ENV=production,MAX_INSTANCES=${_MAX_INSTANCES},ENABLE_H2C=true,WINDBG_API_BASE_URL=https://windbg-api.stack-tech.net,CACHE_ZSTD_DICTIONARY_PATH=/secrets/redis-zstd/dictionary,CACHE_ZSTD_WRITES_ENABLED=${_CACHE_ZSTD_WRITES_ENABLED},WF_CRASH_SIGNAL_URL=${_WF_CRASH_SIGNAL_URL},CSP_MODE=${_CSP_MODE}" \
          --update-secrets "$${AI_SECRET_BINDING}$${CRASH_SIGNAL_BINDING}$${QUOTA_STORE_BINDING},TURNSTILE_SECRET_KEY=turnstile-secret-key:latest,SESSION_SECRET=session-secret:latest,BSOD_API_KEY=bsod-api-key:latest,WINDBG_API_KEY=windbg-api-key:latest,WF_SSO_SECRET=wf-sso-secret:latest,/secrets/redis-zstd/dictionary=redis-zstd-dictionary:${_CACHE_ZSTD_DICTIONARY_VERSION}"

  # Purge Cloudflare cache after deployment
  - name: 'gcr.io/cloud-builders/curl'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🧹 Purging Cloudflare cache for bsod.windowsforum.com..."
        RESPONSE=$$(curl -s -w "\n%{http_code}" -X POST \
          "https://api.cloudflare.com/client/v4/zones/$${CLOUDFLARE_ZONE_ID}/purge_cache" \
          -H "Authorization: Bearer $${CLOUDFLARE_PURGE_TOKEN}" \
          -H "Content-Type: application/json" \
          --data '{"hosts":["bsod.windowsforum.com"]}')
        HTTP_CODE=$$(echo "$$RESPONSE" | tail -n1)
        if [ "$$HTTP_CODE" = "200" ]; then
          echo "✅ Cloudflare cache purged successfully"
        else
          echo "❌ Cloudflare cache purge failed with HTTP $$HTTP_CODE"
          echo "Stale HTML in CDN will cause blank pages for users."
          exit 1
        fi
    secretEnv: ['CLOUDFLARE_PURGE_TOKEN', 'CLOUDFLARE_ZONE_ID']

substitutions:
  _REGION: us-east1
  # Cloud Run --max-instances, also passed to the app as MAX_INSTANCES so its
  # per-instance budgets (provider free tiers) are split across every
  # instance that can run at once.
  _MAX_INSTANCES: '10'
  # Dictionary deployments must pin a numeric Secret Manager version. Version
  # 1 is the initial rollout default; override it after every dictionary upload.
  _CACHE_ZSTD_DICTIONARY_VERSION: '1'
  # Production completed the reader-first rollout. Override to false only when
  # deliberately staging a new dictionary-aware reader revision.
  _CACHE_ZSTD_WRITES_ENABLED: 'true'
  # All configured providers are bound so model.cfg can be hot-swapped between
  # them at runtime without a redeploy. Experiential is appended only when its
  # Secret Manager resource has an enabled version.
  # OPENROUTER_API_KEY additionally powers the AI narrative on /stats.
  _AI_SECRET_BINDING: 'GEMINI_API_KEY=gemini-api-key:latest,DEEPSEEK_API_KEY=deepseek-api-key:latest,OPENAI_API_KEY=openai-api-key:latest,OPENAI_ADMIN_KEY=openai-admin-key:latest,OPENROUTER_API_KEY=openrouter-api-key:latest'
  # WindowsForum crash-signal ingest base (fastapi-app /api/ideaengine); the key
  # is bound from wf-crash-signal-key when that secret has an enabled version.
  _WF_CRASH_SIGNAL_URL: 'https://search.windowsforum.com/api/ideaengine'
  # Content-Security-Policy rollout (server/securityHeaders.js, issue #154).
  # 'report-only' keeps the legacy policy enforcing and ships the hash-based
  # policy as Report-Only, logging violations as csp.violation events;
  # 'enforce' makes the hash-based policy the enforcing one. Applied by builds
  # that run this file and by deploy-with-secret.sh, so an out-of-band CSP_MODE
  # does not linger there. NOTE: the Cloud Build trigger on main runs its own
  # inline steps (docker build/push, `gcloud run services update --image`,
  # Cloudflare purge) and does not read this file, so editing _CSP_MODE does not
  # change the live service. Change the live mode with
  #   gcloud run services update bsod-analyzer --region us-east1 \
  #     --update-env-vars CSP_MODE=<report-only|enforce>
  # and purge the Cloudflare cache for bsod.windowsforum.com (HTML is cached
  # with the old header until then). Later image-only deploys keep the value.
  _CSP_MODE: 'report-only'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/cloudflare-purge-token/versions/latest
      env: 'CLOUDFLARE_PURGE_TOKEN'
    - versionName: projects/$PROJECT_ID/secrets/cloudflare-zone-id/versions/latest
      env: 'CLOUDFLARE_ZONE_ID'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/bsod-analyzer:latest'
