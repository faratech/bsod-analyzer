steps:
  # Reject mutable dictionary aliases and invalid staged-write values before
  # spending time on the image build.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-ceu'
      - |
        if [[ ! "${_CACHE_ZSTD_DICTIONARY_VERSION}" =~ ^[1-9][0-9]*$ ]]; then
          echo "_CACHE_ZSTD_DICTIONARY_VERSION must be a pinned numeric Secret Manager version."
          exit 1
        fi
        if [[ "${_CACHE_ZSTD_WRITES_ENABLED}" != "true" && "${_CACHE_ZSTD_WRITES_ENABLED}" != "false" ]]; then
          echo "_CACHE_ZSTD_WRITES_ENABLED must be exactly 'true' or 'false'."
          exit 1
        fi

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--pull', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/bsod-analyzer:latest', '.']
  
  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/bsod-analyzer:latest']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'bsod-analyzer'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/bsod-analyzer:latest'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--no-default-url'
      - '--service-account'
      - 'bsod-analyzer-runtime@$PROJECT_ID.iam.gserviceaccount.com'
      - '--port'
      - '8080'
      - '--use-http2'
      - '--max-instances'
      - '10'
      - '--concurrency'
      - '2'
      - '--min-instances'
      - '1'
      - '--memory'
      - '1Gi'
      - '--no-cpu-throttling'
      - '--cpu-boost'
      - '--update-env-vars'
      - 'NODE_ENV=production,ENABLE_H2C=true,WINDBG_API_BASE_URL=https://windbg-api.stack-tech.net,CACHE_ZSTD_DICTIONARY_PATH=/secrets/redis-zstd/dictionary,CACHE_ZSTD_WRITES_ENABLED=${_CACHE_ZSTD_WRITES_ENABLED}'
      - '--update-secrets'
      - '${_AI_SECRET_BINDING},TURNSTILE_SECRET_KEY=turnstile-secret-key:latest,SESSION_SECRET=session-secret:latest,BSOD_API_KEY=bsod-api-key:latest,WINDBG_API_KEY=windbg-api-key:latest,WF_SSO_SECRET=wf-sso-secret:latest,UPSTASH_REDIS_REST_URL=upstash-redis-url:latest,UPSTASH_REDIS_REST_TOKEN=upstash-redis-token:latest,/secrets/redis-zstd/dictionary=redis-zstd-dictionary:${_CACHE_ZSTD_DICTIONARY_VERSION}'

  # Purge Cloudflare cache after deployment
  - name: 'gcr.io/cloud-builders/curl'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🧹 Purging Cloudflare cache for bsod.windowsforum.com..."
        RESPONSE=$$(curl -s -w "\n%{http_code}" -X POST \
          "https://api.cloudflare.com/client/v4/zones/$${CLOUDFLARE_ZONE_ID}/purge_cache" \
          -H "Authorization: Bearer $${CLOUDFLARE_PURGE_TOKEN}" \
          -H "Content-Type: application/json" \
          --data '{"hosts":["bsod.windowsforum.com"]}')
        HTTP_CODE=$$(echo "$$RESPONSE" | tail -n1)
        if [ "$$HTTP_CODE" = "200" ]; then
          echo "✅ Cloudflare cache purged successfully"
        else
          echo "❌ Cloudflare cache purge failed with HTTP $$HTTP_CODE"
          echo "Stale HTML in CDN will cause blank pages for users."
          exit 1
        fi
    secretEnv: ['CLOUDFLARE_PURGE_TOKEN', 'CLOUDFLARE_ZONE_ID']

substitutions:
  _REGION: us-east1
  # Dictionary deployments must pin a numeric Secret Manager version. Version
  # 1 is the initial rollout default; override it after every dictionary upload.
  _CACHE_ZSTD_DICTIONARY_VERSION: '1'
  # Production completed the reader-first rollout. Override to false only when
  # deliberately staging a new dictionary-aware reader revision.
  _CACHE_ZSTD_WRITES_ENABLED: 'true'
  # All providers are bound so model.cfg can be hot-swapped between them at
  # runtime without a redeploy. All secrets must exist in Secret Manager.
  # OPENROUTER_API_KEY additionally powers the AI narrative on /stats.
  _AI_SECRET_BINDING: 'GEMINI_API_KEY=gemini-api-key:latest,DEEPSEEK_API_KEY=deepseek-api-key:latest,OPENAI_API_KEY=openai-api-key:latest,OPENAI_ADMIN_KEY=openai-admin-key:latest,OPENROUTER_API_KEY=openrouter-api-key:latest'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/cloudflare-purge-token/versions/latest
      env: 'CLOUDFLARE_PURGE_TOKEN'
    - versionName: projects/$PROJECT_ID/secrets/cloudflare-zone-id/versions/latest
      env: 'CLOUDFLARE_ZONE_ID'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/bsod-analyzer:latest'
